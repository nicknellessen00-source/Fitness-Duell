# Baut die Web-Version bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
name: Web-Version auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_BASE_URL: /${{ github.event.repository.name }}
      # Android-App als Datei im neuesten GitHub-Release (FitDuell.apk), falls vorhanden
      APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/FitDuell.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
      - run: node scripts/pages-prepare.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

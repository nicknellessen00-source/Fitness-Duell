# Netlify: statische App, kein Build-Schritt
[build]
  publish = "."
  command = ""

# Service Worker und Konfiguration immer frisch laden, damit Updates sofort ankommen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), accelerometer=(self), gyroscope=(self)"
